# Built-in settings; ~/.palepale/config.toml, .palepale/config.toml and flags override them in that
# order. `[[permission]]` rules are appended instead, and the last matching rule wins.
model = ""
system_prompt = "default"
mode = "auto"
# Published releases check before interactive startup and reopen after a verified update.
# PALEPALE_NO_UPDATE also disables automatic checks.
auto_update = true

[[permission]]
permission = "*"
pattern = "*"
action = "ask"

[[permission]]
permission = "websearch"
pattern = "*"
action = "allow"

[[permission]]
permission = "read"
pattern = "*"
action = "allow"

# Secrets: reading them still asks.
[[permission]]
permission = "read"
pattern = "*.env"
action = "ask"

[[permission]]
permission = "read"
pattern = "*.env.*"
action = "ask"

[[permission]]
permission = "search"
pattern = "*"
action = "allow"

# grep and glob read contents too; a secret as their root asks like a read does.
[[permission]]
permission = "search"
pattern = "*.env"
action = "ask"

[[permission]]
permission = "search"
pattern = "*.env.*"
action = "ask"

# Inspection runs without asking (data/command_lists.toml, the list PLAN locks open too); a flag
# that makes it write or run another program asks again.
[[permission]]
permission = "bash"
action = "allow"
list = "inspect"

[[permission]]
permission = "bash"
action = "ask"
list = "unsafe_flags"

[[permission]]
permission = "todo"
pattern = "*"
action = "allow"

[[permission]]
permission = "skill"
pattern = "*"
action = "allow"

# Asking the user and handing over a plan are conversations, not actions.
[[permission]]
permission = "question"
pattern = "*"
action = "allow"

[[permission]]
permission = "plan_exit"
pattern = "*"
action = "allow"

[[permission]]
permission = "task"
pattern = "*"
action = "allow"
