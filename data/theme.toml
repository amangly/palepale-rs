# What everything looks like. Code styles text by role; roles name palette colours (or a hex).
# `default` means the terminal's own colour, so text stays readable on light and dark themes.

[palette]
green = "#00FF41"
purple = "#A855F7"
orange = "#FF8A3D"
red = "#FF4D5E"
muted = "#6F9277"
blue = "#60A5FA"
yellow = "#E5C07B"
teal = "#56B6C2"
gray = "#A0B9A7"
slate = "#081A0C"
paper = "#DBFFDB"
matrix_soft = "#74C68A"

[roles]
text = "default"
accent = "green"
muted = "muted"
error = "red"
warn = "orange"
heading = "green"
strong = "default"
code = "teal"
link = "blue"
quote = "muted"
rule = "muted"
bullet = "green"
diff_add = "green"
diff_del = "red"
diff_hunk = "purple"
reasoning = "muted"
user = "green"
# The band behind the user's messages sets both colours, so it reads on light and dark terminals.
user_band = "slate"
user_text = "paper"
reply = "matrix_soft"
chart_output = "matrix_soft"
toast = "slate"
toast_text = "green"
running = "orange"
done = "green"
mode_manual = "gray"
mode_auto = "green"
mode_plan = "matrix_soft"
effort_low = "gray"
effort_medium = "green"
effort_high = "orange"
effort_max = "red"
syn_keyword = "purple"
syn_string = "green"
syn_number = "orange"
syn_function = "blue"
syn_type = "yellow"
syn_constant = "orange"
syn_comment = "muted"

# Syntax scopes to roles; the most specific matching selector wins, as in editor themes.
[[syntax]]
scope = "comment"
role = "syn_comment"

[[syntax]]
scope = "string, constant.character"
role = "syn_string"

[[syntax]]
scope = "constant.numeric"
role = "syn_number"

[[syntax]]
scope = "constant.language, support.constant, variable.language"
role = "syn_constant"

[[syntax]]
scope = "entity.name.function, support.function, variable.function"
role = "syn_function"

[[syntax]]
scope = "entity.name.type, entity.name.class, entity.name.struct, entity.name.enum, support.type"
role = "syn_type"

[[syntax]]
scope = "keyword - keyword.operator, storage"
role = "syn_keyword"
