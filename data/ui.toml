# Words and shapes of the interactive UI. Colours are in theme.toml, keys in keybinds.toml.

spinner = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"]
prompt = "› "
# Runs down the left edge of the user's messages, blank band rows included.
user_mark = "│ "
# Starts each stretch of the model's prose; what follows it hangs under the text.
reply_mark = "› "
placeholder = "Write a message…  / for commands"
tips = [
  "/help commands · /status usage · /models model",
]

[footer]
# All the status, right-aligned on the rule under the message bar, in this order.
# The rule above the bar is plain, in the mode's colour.
items = ["mode", "profile", "model", "context"]
separator = " · "

[text]
chat_only = "Chat only · this model route has no tools. /models switches models."
tool_expand = "click to expand"
interrupt = "esc to interrupt"
retrying = "retrying in"
queued = "queued"
steering = "steering"
cost_estimate = "est"
interrupted = "Interrupted."
declined = "Stopped: you declined a call."
cut_off = "The reply hit the configured backend output limit."
ctrl_c_again = "Press Ctrl+C again to quit"
unknown_command = "Unknown command {command}. {help} lists them."
command_quote = "Close the quoted argument and try again."
more_lines = { one = "… {n} more line", many = "… {n} more lines" }
elsewhere = "{command} only works as {places}."
more_below = "↓ {n} more · PgDn"
saved = "Session saved to {path}"
unsaved = "No longer saving this session to {path}: {error}. The conversation goes on unsaved."
copied = "✓ Copied"
nothing_to_copy = "Nothing to copy yet: palepale has not replied."
busy = "Finish or interrupt the reply first (Esc)."
new_conversation = "A new conversation."
new_saved = "A new conversation. The last one is saved in {path}."

# The status line shows an activity indicator, task verb, elapsed time, and tokens.
[status]
# Every activity frame has the same width, so the task verb stays in place.
frames = ["⠑⢄⡠⠊⠑", "⠢⣀⠔⠉⠢", "⢄⡠⠊⠑⢄", "⣀⠔⠉⠢⣀", "⡠⠊⠑⢄⡠", "⠔⠉⠢⣀⠔", "⠊⠑⢄⡠⠊", "⠉⠢⣀⠔⠉"]
# For terminals without braille (legacy Windows conhost).
plain = ["'._-'", "-_.'-", "._-'.", "_.'-_", "_-'._", ".'-_.", "-'._-", "'-_.'"]
# One per turn, never the same twice running.
verbs = ["Thinking", "Working", "Analyzing"]
tokens = "↓ {n} tok"

[status.actions]
waiting = "Waiting for response"
reasoning = "Thinking"
reply = "Writing response"
tool = "Using tools"
read = "Reading files"
write = "Writing files"
edit = "Editing files"
bash = "Running command"
glob = "Finding files"
grep = "Searching files"
codesearch = "Searching code"
webfetch = "Fetching page"

# Thinking blocks: a click opens or closes one, Ctrl+T all of them.
[thinking]
closed = "▸"
open = "▾"
done = "Thought for {secs}s"
live = "Thinking… {secs}s"
gutter = "│ "

# `/models` inside a session.
[picker]
title = "Models"
hint = "↑↓ move · → or enter select · esc close"
switched = "Model: {model}. Saved as your default."

# The popup listing commands while a `/name` is typed.
[palette]
title = "commands"

# `/login` inside a session; {placeholders} are filled in.
[login]
title = "Log in to palepale"
pair = "Pair this device (approve in your browser)"
number = "Enter my account number"
starting = "Asking palepale for a pairing code…"
open = "Open {url}"
code = "Confirm this code in your browser: "
copy_code = "  (right-click copies it)"
waiting = "Waiting for approval…"
checking = "Checking with palepale…"
failed = "Login failed: {error}"
hint = "esc cancel"

# `/forums` in a session: the forums the agent can browse, to log in to, log out of, remove or add.
[forums]
title = "Forums"
guest = "guest"
logged_in = "logged in as {user}"
add = "+ Add a forum"
hint = "↑↓ move · → or enter open · esc close"
menu_hint = "↑↓ move · enter choose · 1-9 pick · esc back"
log_in = "Log in"
log_in_again = "Log in as someone else"
log_out = "Log out"
remove = "Remove"
add_title = "Add a forum"
add_note = "Searches Tapatalk's directory; only forums running the Tapatalk plugin can be added."
search = "Search by name or URL…"
found_title = "Forums matching “{query}”"
found_hint = "↑↓ move · → or enter add · esc back"
no_match = "No Tapatalk forum matched “{query}”."
login_title = "Log in to {name}"
login_note = "palepale keeps only the session cookie the forum hands back, never the password."
username = "Username: "
password = "Password: "
input_hint = "enter next · esc back"
searching = "Searching Tapatalk's directory for “{query}”…"
adding = "Adding {name}…"
logging_in = "Logging in to {name} as {user}…"
saving = "Saving…"
cancel_hint = "esc cancel"
failed = "Forums: {error}"

# The card that replaces the editor when palepale needs an answer.
[card]
hint = "↑↓ move · enter choose · 1-9 pick · esc no"
input_hint = "enter send · esc back"
other = "Other…"
plan_title = "Plan ready"
plan_other = "Tell palepale what to change…"
# The model's questions: one tab each, then a review before the answers go back.
questions_title = "Your input"
question_tab = "Question {n}"
review_tab = "Send"
review_title = "Your answers"
own_words = "“{text}”"
unanswered = "not answered yet"
question_hint = "↑↓ move · enter choose · 1-9 pick · ←→ questions · esc dismiss"
multiple_hint = "↑↓ move · space or 1-9 tick · enter done · ←→ questions · esc dismiss"
review_hint = "enter send · ← or 1-9 change an answer · esc dismiss"

# Permission answers: `reply` is yes, no, or no_why (asks for the reason).
[[card.permission]]
label = "Allow this action"
reply = "yes"

[[card.permission]]
label = "Decline"
reply = "no"

[[card.permission]]
label = "Decline with feedback…"
reply = "no_why"

# How a run that ended early is told.
[outcome]
turn_limit = "Stopped after {count} turns. Send a message to continue."
