# Keep cffetch outside the workspace so the vendored dependency retains its own
# formatting and lint configuration. Run its tests from its directory.
# The battery's cloned repos are their own projects, never members.
[workspace]
exclude = ["crates/cffetch", "bench/cache"]

[package]
name = "palepale"
default-run = "palepale"
autotests = false
version = "0.1.26"
edition = "2024"
rust-version = "1.98"
description = "Palepale native terminal coding agent"
authors = ["amangly"]
license = "Apache-2.0"
publish = false

[dependencies]
minisign-verify = "0.3.0"
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
async-trait = "0.1.92"
base64 = "0.23.1"
# webfetch only: browser TLS (wreq/BoringSSL), challenge detection. The API stays on reqwest.
cffetch = { path = "crates/cffetch" }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
fastrand = "2.5.0"
futures-util = "0.3.34"
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
htmd = "0.5.5"
ignore = "0.4.33"
jiff = { version = "0.2.37", features = ["serde"] }
jsonschema = { version = "0.58.6", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "creation-flags", "job-object", "process-group", "kill-on-drop"] }
quick-xml = "0.37.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "http2", "rustls", "system-proxy"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
sse-stream = "0.2.6"
similar = "3.2.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal", "process", "net"] }
tokio-util = "0.7.19"
toml = "1.1.6"
toml_edit = "0.25.17"
ttfx = { git = "https://github.com/omacom/ttfx", rev = "921bd551c308c235e01c5867f0199efe0691c271" }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"

[dev-dependencies]
minisign = "0.10.0"
axum = "0.8.9"
insta = "1.48.0"
portable-pty = "0.9.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["net", "process"] }
vt100 = "0.16.2"

[[bin]]
name = "palepale-fake-mcp"
path = "tests/fake_mcp/main.rs"
bench = false

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[[test]]
name = "battery"
path = "tests/battery/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Registry"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
